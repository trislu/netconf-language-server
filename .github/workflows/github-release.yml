name: VSCE Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  build-linux:
    name: Build Linux binary (gnu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Native gnu build: the runner's host toolchain (glibc) is used directly,
      # so no cross/musl tooling is installed. The catalog scan is allocation
      # heavy, and a static musl build turns that churn into a syscall storm
      # (~10x wall time, 69% sys CPU) — see
      # docs/perf/catalog-scan-regression-2026-09-11.md §6 P0.
      - name: Build for Linux x64
        run: cargo build --release --target x86_64-unknown-linux-gnu

      # Guard the packaging choice: the shipped Linux binary must be a gnu
      # (dynamically linked) build, never the old static musl artifact.
      - name: Verify gnu binary
        run: |
          file target/x86_64-unknown-linux-gnu/release/netconf-language-server
          ldd target/x86_64-unknown-linux-gnu/release/netconf-language-server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: target/x86_64-unknown-linux-gnu/release/netconf-language-server

  build-windows:
    name: Build Windows binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build for Windows x64
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows
          path: target/x86_64-pc-windows-gnu/release/netconf-language-server.exe

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build for macOS arm64
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-macos
          path: target/release/netconf-language-server

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: binary-linux
          path: artifacts/linux

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: binary-windows
          path: artifacts/windows

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: binary-macos
          path: artifacts/macos

      - name: Copy server binaries
        run: |
          mkdir -p clients/vscode/resources/bin
          cp artifacts/windows/netconf-language-server.exe clients/vscode/resources/bin/netconf-language-server-win32.exe
          cp artifacts/linux/netconf-language-server clients/vscode/resources/bin/netconf-language-server-linux
          cp artifacts/macos/netconf-language-server clients/vscode/resources/bin/netconf-language-server-darwin
          chmod +x clients/vscode/resources/bin/netconf-language-server-linux
          chmod +x clients/vscode/resources/bin/netconf-language-server-darwin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        working-directory: clients/vscode
        run: npm install

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package VSIX
        working-directory: clients/vscode
        run: |
          mkdir -p ../../output
          vsce package -o ../../output/

      - name: Upload VSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vsix-packages
          path: output/*.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            clients/vscode/resources/bin/*
            output/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
