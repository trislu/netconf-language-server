[package]
name = "netconf-language-server"
version = "0.1.0"
edition = "2024"
description = "A language server implemented in rust for reading & writing NETCONF/YANG text"
authors = ["Lu Kai <mailto:lukai@mail.ustc.edu.cn>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/trislu/netconf-language-server"
keywords = ["netconf", "yang", "language-server", "rust"]
categories = ["development-tools"]

[dependencies]

dunce = "1.0"
moka = { version = "0.12", features = ["future"] }
regex = "1"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.28"
toml = "0.9"
tokio = { version = "1.37", features = ["full"] }
tower-lsp-server = "0.23"

tree-sitter = "0.26"
tree-sitter-xml = "0.7"
tree-sitter-json = "0.24"

yrepo = { version = "0.3", features = ["parallel"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
