[package]
name = "netconf-lsp"
version = "0.1.0"
edition = "2024"
description = "A language server implemented in rust for writing NETCONF/YANG"
authors = ["Lu Kai <mailto:lukai@mail.ustc.edu.cn>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/trislu/netconf-lsp"
keywords = ["netconf", "yang", "language-server", "rust"]
categories = ["development-tools"]

[dependencies]

moka = { version = "0.12", features = ["future"] }
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.28"
toml = "0.9"
tokio = { version = "1.37", features = ["full"] }
tower-lsp-server = "0.23"

yrepo = { path = "../yrepo" }
