[package]
name = "netconf-language-server"
version = "0.7.0"
edition = "2024"
description = "A language server implemented in rust for reading & writing NETCONF/YANG text"
authors = ["Lu Kai <mailto:lukai@mail.ustc.edu.cn>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/trislu/netconf-language-server"
keywords = ["netconf", "yang", "language-server", "rust"]
categories = ["development-tools"]

[dependencies]

dunce = "1.0"
moka = { version = "0.12", features = ["future"] }
regex = "1"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.28"
toml = "0.9"
tokio = { version = "1.37", features = ["full"] }
tower-lsp-server = "0.23"

tree-sitter = "0.26"
tree-sitter-xml = "0.7"
tree-sitter-json = "0.24"

yrepo = { version = "0.7.1", features = ["parallel"] }

# Linux ships two flavors of the same server (gnu and musl). The catalog scan
# allocates one owned `String` per CST leaf, and the default musl allocator turns
# that churn into a syscall storm (~10x wall time, 69% sys CPU) — see
# docs/perf/catalog-scan-regression-2026-09-11.md §6 P0. mimalloc keeps the churn
# in user space; `override` also interposes the C `malloc`/`free` symbols so the
# tree-sitter parser's own allocations use it too (src/main.rs installs it as the
# global allocator).
# Scoped to Linux so the Windows/macOS artifacts keep their system allocators.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", features = ["override"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
